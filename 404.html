
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Stackly Law</title>

    <link rel="stylesheet" href="css/404.css">

    <!-- MATERIAL SYMBOLS -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <!-- GOOGLE FONT -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500&display=swap"
    >

</head>

<body class="stackly-404-body">


    <!-- =====================================
         STACKLY 404 SECTION
    ====================================== -->

    <main class="stackly-404-wrapper">


        <!-- MAIN ERROR CARD -->
        <section class="stackly-404-card">


            <!-- STACKLY LOGO -->

            <a href="index.html" class="stackly-404-logo">

                <img
                    src="assets/logo 4.webp"
                    alt="Stackly Logo"
                >

            </a>


            <!-- 404 GRAPHIC -->

            <div class="stackly-404-graphic">

                <span class="stackly-404-number">4</span>


                <div class="stackly-404-symbol">

                    <div class="stackly-404-symbol-inner">

                        <span class="material-symbols-outlined">
                            account_balance
                        </span>

                    </div>

                </div>


                <span class="stackly-404-number">4</span>

            </div>



            <!-- ERROR LABEL -->

            <div class="stackly-404-label">
                A LITTLE LEGAL DETOUR
            </div>



            <!-- HEADING -->

            <h1>
                Justice is still
                <span>within reach.</span>
            </h1>



            <!-- DESCRIPTION -->

            <p class="stackly-404-description">

                It looks like this page is unavailable or has moved.
                Don't worry. Our legal team is here to help you
                find your way back to the right place.

            </p>



            <!-- BUTTONS -->

            <div class="stackly-404-actions">


                <a href="index.html" class="stackly-404-home-btn">

                    Back to Home

                </a>


                <button
                    type="button"
                    class="stackly-404-back-btn"
                    id="stacklyGoBack"
                >

                    Go Back

                </button>


            </div>



            <!-- ERROR CODE -->

            <div class="stackly-404-code">

                ERROR CODE <strong>404</strong>

            </div>


        </section>



        <!-- BOTTOM TAGLINE -->

        <div class="stackly-404-footer">

            Trusted Counsel. Dedicated Representation.

        </div>


    </main>



    <!-- JAVASCRIPT -->

    <script src="js/404.js"></script>

</body>
</html>
